    <rect x="778" y="470" width="96" height="52" fill="#ffffff" stroke="#333333" stroke-width="1"/>
    <rect x="778" y="470" width="96" height="17" fill="#ffffff"/>
    <rect x="778" y="487" width="96" height="18" fill="#0039a6"/>
    <rect x="778" y="505" width="96" height="17" fill="#d52b1e"/>
  </g>
  <!-- Silhouettes: heads and shoulders, no faces -->
  <circle cx="298" cy="508" r="13" fill="#2b2b2b"/>
  <path d="M 272 558 L 272 534 Q 298 518 324 534 L 324 558 Z" fill="#2b2b2b"/>
  <circle cx="562" cy="508" r="13" fill="#2b2b2b"/>
  <path d="M 536 558 L 536 534 Q 562 518 588 534 L 588 558 Z" fill="#2b2b2b"/>
  <circle cx="826" cy="508" r="13" fill="#2b2b2b"/>
  <path d="M 800 558 L 800 534 Q 826 518 852 534 L 852 558 Z" fill="#2b2b2b"/>
  <text x="512" y="586" font-family="Liberation Serif, DejaVu Serif, serif" font-size="18" font-style="italic" fill="#333333" text-anchor="middle">The three leaders at the APEC summit in Shenzhen on Thursday.</text>
  <rect x="36" y="600" width="952" height="1" fill="#111111"/>
  <!-- Secondary stories, two columns -->
  <line x1="512" y1="612" x2="512" y2="872" stroke="#999999" stroke-width="1"/>
  <!-- (a) US-Iran -->
  <text x="36" y="648" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">US AND IRAN EXCHANGE</text>
  <text x="36" y="684" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">FIRE IN THE GULF</text>
  <text x="36" y="714" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">Bases in Kuwait and Bahrain are hit as the United States</text>
  <text x="36" y="739" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">strikes a site on Qeshm Island in reply.</text>
  <!-- (b) GTA VI -->
  <text x="524" y="648" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">GTA VI LAUNCHES</text>
  <text x="524" y="684" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">WORLDWIDE</text>
  <text x="524" y="714" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">Vice City returns after thirteen years as players flood in</text>
  <text x="524" y="739" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">on day one around the world.</text>
  <rect x="36" y="756" width="952" height="1" fill="#999999"/>
  <!-- (c) Nvidia / Anthropic -->
  <text x="36" y="792" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">NVIDIA HALTS CHIP</text>
  <text x="36" y="828" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">SHIPMENTS TO CHINA</text>
  <text x="36" y="858" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">Shipments of advanced chips to China are halted, while</text>
  <text x="36" y="883" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">Anthropic files an $81.3bn IPO, the largest ever.</text>
  <!-- (d) EU / Ukraine -->
  <text x="524" y="792" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">EU AGREES &#8364;45BN LOAN FOR</text>
  <text x="524" y="828" font-family="Liberation Serif, DejaVu Serif, serif" font-size="32" font-weight="bold" fill="#111111">UKRAINE</text>
  <text x="524" y="858" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">A &#8364;45bn loan is agreed as the Crimean Bridge is attacked</text>
  <text x="524" y="883" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">again and fighting continues.</text>
  <rect x="36" y="900" width="952" height="1" fill="#111111"/>
  <!-- Also in today's paper -->
  <text x="512" y="922" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" letter-spacing="2">ALSO IN TODAY&#8217;S PAPER</text>
  <rect x="36" y="932" width="952" height="1" fill="#999999"/>
  <text x="36" y="956" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">&#8226; Myanmar Rohingya verdict at UN court</text>
  <text x="524" y="956" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">&#8226; Voyager 1 passes one light-day</text>
  <text x="36" y="980" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">&#8226; Six killed in Gaza strikes</text>
  <text x="524" y="980" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">&#8226; Van Gogh sells for $190.4m record</text>
  <text x="36" y="1004" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">&#8226; Jeffries wins Speaker nomination</text>
  <text x="524" y="1004" font-family="Liberation Serif, DejaVu Serif, serif" font-size="20" fill="#1a1a1a">&#8226; Cyclone Akvan nears Indian coast</text>
</svg>
