<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>The World Today — Thursday, 19 November 2026</title>
  <rect x="0" y="0" width="1024" height="1024" fill="#fbf8f1"/>
  <rect x="14" y="14" width="996" height="996" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Masthead -->
  <text x="512" y="102" font-family="Liberation Serif, DejaVu Serif, serif" font-size="90" font-weight="bold" fill="#111111" text-anchor="middle" letter-spacing="1">THE WORLD TODAY</text>
  <rect x="36" y="114" width="952" height="3" fill="#111111"/>
  <rect x="36" y="121" width="952" height="1" fill="#111111"/>
  <text x="36" y="146" font-family="Liberation Serif, DejaVu Serif, serif" font-size="19" font-weight="bold" fill="#111111">THURSDAY, 19 NOVEMBER 2026</text>
  <text x="512" y="146" font-family="Liberation Serif, DejaVu Serif, serif" font-size="19" fill="#333333" text-anchor="middle">Vol. 1 — No. 323</text>
  <text x="988" y="146" font-family="Liberation Serif, DejaVu Serif, serif" font-size="19" fill="#333333" text-anchor="end">Price $2.00</text>
  <rect x="36" y="158" width="952" height="1" fill="#111111"/>
  <rect x="36" y="163" width="952" height="3" fill="#111111"/>
  <!-- Lead headline -->
  <text x="36" y="232" font-family="Liberation Serif, DejaVu Serif, serif" font-size="64" font-weight="bold" fill="#111111">TRUMP, XI AND PUTIN MEET</text>
  <text x="36" y="300" font-family="Liberation Serif, DejaVu Serif, serif" font-size="64" font-weight="bold" fill="#111111">AT APEC SUMMIT IN</text>
  <text x="36" y="368" font-family="Liberation Serif, DejaVu Serif, serif" font-size="64" font-weight="bold" fill="#111111">SHENZHEN</text>
  <text x="36" y="402" font-family="Liberation Serif, DejaVu Serif, serif" font-size="24" font-style="italic" fill="#222222">Three leaders hold trilateral talks in Shenzhen as trade and security top the agenda</text>
  <rect x="36" y="418" width="952" height="1" fill="#111111"/>
  <!-- Lead illustration: podium with three flags, symbolic silhouettes, no faces -->
  <rect x="36" y="430" width="952" height="128" fill="#e9e5d8"/>
  <rect x="36" y="430" width="952" height="128" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="36" y="430" width="952" height="30" fill="#1f2a44"/>
  <text x="512" y="452" font-family="Liberation Serif, DejaVu Serif, serif" font-size="19" font-weight="bold" fill="#fbf8f1" text-anchor="middle" letter-spacing="4">APEC &#183; SHENZHEN</text>
  <!-- Flag poles -->
  <rect x="246" y="470" width="4" height="60" fill="#333333"/>
  <rect x="510" y="470" width="4" height="60" fill="#333333"/>
  <rect x="774" y="470" width="4" height="60" fill="#333333"/>
  <!-- USA flag -->
  <g>
    <rect x="250" y="470" width="96" height="52" fill="#ffffff" stroke="#333333" stroke-width="1"/>
    <rect x="250" y="470" width="96" height="4" fill="#b22234"/>
    <rect x="250" y="478" width="96" height="4" fill="#b22234"/>
    <rect x="250" y="486" width="96" height="4" fill="#b22234"/>
    <rect x="250" y="494" width="96" height="4" fill="#b22234"/>
    <rect x="250" y="502" width="96" height="4" fill="#b22234"/>
    <rect x="250" y="510" width="96" height="4" fill="#b22234"/>
    <rect x="250" y="518" width="96" height="4" fill="#b22234"/>
    <rect x="250" y="470" width="40" height="28" fill="#3c3b6e"/>
    <circle cx="258" cy="477" r="1.6" fill="#ffffff"/><circle cx="268" cy="477" r="1.6" fill="#ffffff"/><circle cx="278" cy="477" r="1.6" fill="#ffffff"/>
    <circle cx="258" cy="484" r="1.6" fill="#ffffff"/><circle cx="268" cy="484" r="1.6" fill="#ffffff"/><circle cx="278" cy="484" r="1.6" fill="#ffffff"/>
    <circle cx="258" cy="491" r="1.6" fill="#ffffff"/><circle cx="268" cy="491" r="1.6" fill="#ffffff"/><circle cx="278" cy="491" r="1.6" fill="#ffffff"/>
  </g>
  <!-- China flag -->
  <g>
    <rect x="514" y="470" width="96" height="52" fill="#de2910" stroke="#333333" stroke-width="1"/>
    <circle cx="530" cy="486" r="7" fill="#ffde00"/>
    <circle cx="552" cy="478" r="2.6" fill="#ffde00"/><circle cx="560" cy="488" r="2.6" fill="#ffde00"/>
    <circle cx="556" cy="500" r="2.6" fill="#ffde00"/><circle cx="544" cy="504" r="2.6" fill="#ffde00"/>
  </g>
